[project]
name = "markitdown-codex"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "markitdown[docx,pdf,pptx,xls,xlsx]==0.1.7",
    "mcp==1.26.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "reportlab>=5.0.1",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
pythonpath = ["plugins/markitdown/skills/markitdown/scripts"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
